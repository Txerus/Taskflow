name: TaskFlow Windows
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: write
concurrency:
  group: taskflow-windows-main
  cancel-in-progress: true
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
          run_install: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm test:e2e
      - run: pnpm build
      - name: Vérifier installation et lancement
        shell: pwsh
        run: ./scripts/smoke-windows.ps1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: TaskFlow-Windows
          path: |
            release/*.exe
            release/*.yml
            release/*.blockmap
            playwright-report/
            docs/screenshots/
      - name: Enregistrer le résultat Windows
        if: always()
        shell: pwsh
        env:
          TASKFLOW_CI_STATUS: ${{ job.status }}
          TASKFLOW_CI_SHA: ${{ github.sha }}
          TASKFLOW_CI_RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          $stamp = (Get-Date).ToUniversalTime().ToString("yyyy-MM-ddTHH:mm:ssZ")
          $content = @"
          # Dernière validation Windows

          - État : $env:TASKFLOW_CI_STATUS
          - Commit testé : $env:TASKFLOW_CI_SHA
          - Run : $env:TASKFLOW_CI_RUN
          - Date UTC : $stamp

          Ce fichier est mis à jour automatiquement par GitHub Actions. Un commit de statut n'est pas une nouvelle version de l'application.
          "@
          $content | Set-Content -Encoding utf8 docs/CI_LATEST.md
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/CI_LATEST.md
          if (git diff --cached --quiet) { exit 0 }
          git commit -m "ci: record Windows validation [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main

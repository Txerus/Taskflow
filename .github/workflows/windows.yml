name: TaskFlow Windows
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: write
concurrency:
  group: taskflow-windows-main
  cancel-in-progress: true
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
          run_install: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm test:e2e
      - run: pnpm build
      - name: Vérifier installation et lancement
        shell: pwsh
        run: ./scripts/smoke-windows.ps1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: TaskFlow-Windows
          path: |
            release/*.exe
            release/*.yml
            release/*.blockmap
            playwright-report/
            docs/screenshots/
      - name: Publier la GitHub Release
        if: success() && github.event_name == 'push' && contains(github.event.head_commit.message, '[release]')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          $tag = "v$version"
          $title = "TaskFlow $tag"
          $notes = @"
          TaskFlow $tag — build Windows validé automatiquement.

          Cette version inclut le socle Messagerie de la Phase 3 : Gmail et Microsoft 365 via OAuth PKCE, cache local, réponses, pièces jointes, mail vers tâche, règles automatiques et suivi des réponses.

          Validation avant publication : TypeScript, Vitest, Playwright Electron, build NSIS et test d'installation/lancement Windows.
          "@
          $assets = @("release/*.exe", "release/*.yml", "release/*.blockmap")
          $published = $false
          for ($attempt = 1; $attempt -le 4; $attempt++) {
            try {
              gh release view $tag *> $null
              if ($LASTEXITCODE -eq 0) {
                gh release upload $tag @assets --clobber
              } else {
                gh release create $tag @assets --target "$env:GITHUB_SHA" --title "$title" --notes "$notes"
              }
              if ($LASTEXITCODE -eq 0) {
                $published = $true
                break
              }
            } catch {
              Write-Warning "Publication Release tentative $attempt : $($_.Exception.Message)"
            }
            if ($attempt -lt 4) { Start-Sleep -Seconds (10 * $attempt) }
          }
          if (-not $published) { throw "Impossible de publier la GitHub Release $tag après 4 tentatives." }
      - name: Enregistrer le résultat Windows
        if: always()
        shell: pwsh
        env:
          TASKFLOW_CI_STATUS: ${{ job.status }}
          TASKFLOW_CI_SHA: ${{ github.sha }}
          TASKFLOW_CI_RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          git fetch origin main
          git reset --hard origin/main
          $stamp = (Get-Date).ToUniversalTime().ToString("yyyy-MM-ddTHH:mm:ssZ")
          $content = @"
          # Dernière validation Windows

          - État : $env:TASKFLOW_CI_STATUS
          - Commit testé : $env:TASKFLOW_CI_SHA
          - Run : $env:TASKFLOW_CI_RUN
          - Date UTC : $stamp

          Ce fichier est mis à jour automatiquement par GitHub Actions. Un commit de statut n'est pas une nouvelle version de l'application.
          "@
          $content | Set-Content -Encoding utf8 docs/CI_LATEST.md
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/CI_LATEST.md
          if (git diff --cached --quiet) { exit 0 }
          git commit -m "ci: record Windows validation [skip ci]"
          git push origin HEAD:main
